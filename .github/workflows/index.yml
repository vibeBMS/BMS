name: Index events

# Writes index.json into the release of each event (creating the release if
# needed): the mirrored files, or for an event that is not mirrored, the
# authors' download links. An event new in events.json first gets its
# folder: works.json from its venue and RELEASE.md (tools/new_event.py).

on:
  workflow_dispatch:
    inputs:
      events:
        description: Event folders, comma separated (empty = all in events.json)
        default: ""

permissions:
  contents: write

concurrency:
  group: index-events

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Events without a folder
        id: new
        env:
          EVENTS: ${{ inputs.events }}
        run: |
          list="$EVENTS"
          [ -n "$list" ] || list=$(python3 -c 'import json; print(",".join(e["tag"] for e in json.load(open("events.json"))))')
          new=""
          for ev in ${list//,/ }; do
            [ -f "$ev/works.json" ] && [ -f "$ev/RELEASE.md" ] || new="$new $ev"
          done
          echo "list=$new" >> "$GITHUB_OUTPUT"
      - if: steps.new.outputs.list != ''
        uses: ./.github/actions/bmseeker
      - name: works.json and RELEASE.md of new events
        if: steps.new.outputs.list != ''
        env:
          NEW: ${{ steps.new.outputs.list }}
        run: |
          python3 tools/new_event.py $NEW
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ev in $NEW; do git add -- "$ev/works.json" "$ev/RELEASE.md"; done
          git commit -q -m "New events:$NEW"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
          for ev in $NEW; do
            python3 -c 'import json,sys; print("| %s | %d works on the venue (new) |" % (sys.argv[1], len(json.load(open(sys.argv[1] + "/works.json")))))' "$ev" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: index.json
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTS: ${{ inputs.events }}
        run: |
          list="$EVENTS"
          [ -n "$list" ] || list=$(python3 -c 'import json; print(",".join(e["tag"] for e in json.load(open("events.json"))))')
          for ev in ${list//,/ }; do
            title=$(python3 -c 'import json,sys; print(next(e["name"] + ": " + e["title"] for e in json.load(open("events.json")) if e["tag"] == sys.argv[1]))' "$ev")
            gh release view "$ev" >/dev/null 2>&1 || \
              gh release create "$ev" --title "$title" --notes-file "$ev/RELEASE.md" --latest=false --target "$GITHUB_SHA"
          done
          tools/publish_index.sh ${list//,/ }
          for ev in ${list//,/ }; do
            python3 -c 'import json,sys; w=json.load(open(sys.argv[1] + "/index.json")); print("| %s | %d works | %d mirrored |" % (sys.argv[1], len(w), sum(bool(x["files"]) for x in w)))' "$ev" >> "$GITHUB_STEP_SUMMARY"
          done
